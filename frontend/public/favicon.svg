<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="#0f172a"/>
  <!-- Graduation cap board (mortarboard) -->
  <!-- Cap flat top -->
  <polygon points="32,14 54,24 32,34 10,24" fill="#ef4444"/>
  <!-- Cap left side -->
  <path d="M10,24 L10,36 Q10,38 12,39 L32,46 L32,34 Z" fill="#dc2626"/>
  <!-- Cap right side -->
  <path d="M54,24 L54,36 Q54,38 52,39 L32,46 L32,34 Z" fill="#dc2626"/>
  <!-- Tassel string -->
  <line x1="54" y1="24" x2="54" y2="38" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tassel bob -->
  <circle cx="54" cy="40" r="3" fill="#fca5a5"/>
</svg>
